<form action="/contact" method="post">
  <fieldset>
    <legend>Contact us</legend>
    <label for="name">Your name</label>
    <input id="name" name="name" placeholder="Jane Doe" value="prefilled">
    <label>Topic
      <select name="topic">
        <option>Billing</option>
        <option value="other">Something else</option>
      </select>
    </label>
    <textarea name="message" placeholder="How can we help?">Draft kept by the browser</textarea>
    <input type="submit" name="action" value="send">
    <input type="reset" value="Clear form">
    <button type="submit" name="action" value="save">Save draft</button>
  </fieldset>
</form>
